name: Buongiorno

on:
  # SCHEDULING DISATTIVATO il 03/08/2026: girava insieme alla funzione
  # schedulata Netlify (buongiorno-scheduled.js) e i due si scontravano sulla
  # scrittura di buongiorno-stato.json (git push di GitHub Actions vs API di
  # Netlify) -> lo stato non si aggiornava a "oggi" e ogni cron rimandava il
  # buongiorno a raffica. Ora il buongiorno lo manda SOLO Netlify (un solo
  # meccanismo, scrive via API senza conflitti). Questo workflow resta solo
  # come backup manuale ("Run workflow").
  workflow_dispatch: {}

permissions:
  contents: write

# Mai due esecuzioni in parallelo: se due dei 10 tentativi dovessero scattare
# quasi insieme, la seconda aspetta in coda che la prima finisca (non viene
# annullata) e a quel punto trova gia' lo stato "inviato" - impossibile che
# parta lo sticker due volte lo stesso giorno.
concurrency:
  group: buongiorno
  cancel-in-progress: false

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invia buongiorno se non gia' fatto oggi (privato poi pubblico)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PRIVATO: ${{ secrets.TELEGRAM_CHAT_ID_PRIVATO }}
          TELEGRAM_CHAT_ID_PUBBLICO: ${{ secrets.TELEGRAM_CHAT_ID_PUBBLICO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node automazioni/invia-buongiorno.js
      - name: Salva lo stato solo se e' stato inviato davvero
        run: |
          if git diff --quiet -- automazioni/buongiorno-stato.json; then
            echo "Niente da salvare (gia' inviato da un tentativo precedente, o test)."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add automazioni/buongiorno-stato.json
            git commit -m "bot: buongiorno inviato $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

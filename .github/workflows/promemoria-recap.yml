name: Promemoria recap

on:
  # PROMEMORIA RECAP DISATTIVATO il 20/08/2026 su richiesta di Alessio: il
  # recap giornaliero non serve piu' (si valuta il passaggio a un recap
  # SETTIMANALE automatico - vedi task Todoist). Niente piu' messaggi orari
  # "vuoi fare il riepilogo?". Il flusso recap resta nel codice ma dormiente
  # (parte solo se Alessio scrive al bot in privato). Resta solo l'avvio
  # manuale, nel caso serva riattivarlo al volo.
  workflow_dispatch: {}

concurrency:
  group: promemoria-recap
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlla e invia promemoria se non risolto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node automazioni/controlla-promemoria.js
